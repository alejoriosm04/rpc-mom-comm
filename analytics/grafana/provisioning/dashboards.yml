apiVersion: 1

providers:
  - name: 'default'
    orgId: 1
    folder: 'Docker Logs'
    type: file
    disableDeletion: false
    editable: true
    options:
      path: /var/lib/grafana/dashboards

datasourses:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: "http://prometheus:9090"  # The Prometheus container URL
    isDefault: true
    editable: true