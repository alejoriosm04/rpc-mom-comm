version: "3.8"

services:
  ecommerce-front:
    image: ecommerce-front
    ports:
      - "3000:3000"
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure

  api-gateway:
    image: api-gateway
    ports:
      - "8000:8000"
    env_file:
      - ./api-gateway/.env
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure

  product_service:
    image: product_service
    env_file:
      - ./microservices/product_service/.env
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure

  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - "5672:5672"
      - "15672:15672"
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  inventory_service:
    image: inventory_service
    env_file:
      - ./microservices/inventory_service/.env
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure

  order_service:
    image: order_service
    env_file:
      - ./microservices/order_service/.env
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure

  loki:
    image: grafana/loki:2.9.2
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki-config.yaml:/etc/loki/local-config.yaml

  promtail:
    image: grafana/promtail:2.9.2
    volumes:
      - /var/log:/var/log
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./analytics/promtail/promtail-config.yaml:/etc/promtail/config.yaml
    command: -config.file=/etc/promtail/config.yaml
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./analytics/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - loki

volumes:
  grafana-storage:
