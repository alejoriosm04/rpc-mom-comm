version: "3.8"

services:
  ecommerce-front:
    image: rpc-mom-comm-ecommerce-front
    ports:
      - "3000:3000"
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure

  api-gateway:
    image: rpc-mom-comm-api-gateway
    ports:
      - "8000:8000"
    env_file:
      - ./api-gateway/.env
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure

  product_service:
    image: rpc-mom-comm-product_service
    env_file:
      - ./microservices/product_service/.env
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure

  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - "5672:5672"
      - "15672:15672"
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  inventory_service:
    image: rpc-mom-comm-inventory_service
    env_file:
      - ./microservices/inventory_service/.env
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure

  order_service:
    image: rpc-mom-comm-order_service
    env_file:
      - ./microservices/order_service/.env
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
