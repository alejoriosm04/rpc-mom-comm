// proto/order.proto
syntax = "proto3";

package order;

service OrderService {
  rpc CreateOrder (OrderRequest) returns (OrderResponse);
}

message OrderRequest {
  int32 product_id = 1;
  int32 quantity = 2;
  string client_id = 3;
}

message OrderResponse {
  bool success = 1;
  string message = 2;
}
