version: "3.8"
services:
  ecommerce-front:
    build: ./ecommerce-app
    container_name: ecommerce-front
    ports:
      - "3000:3000"
  
  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq
    ports:
      - "5672:5672"  # AMQP protocol port
      - "15672:15672"  # Management interface port
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
